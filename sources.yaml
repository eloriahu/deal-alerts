settings:
  alert_discount: 70
  dashboard_discount: 40
  heat_window_minutes: 180
  seen_days: 30
  dashboard_days: 7
  failure_note_after: 5
  same_host_gap_seconds: 3
  max_alerts_per_run: 15
  stale_alert_hours: 6
  max_consecutive_send_failures: 3
  fetch_budget_seconds: 300
  max_alert_age_hours: 24

glitch_words:
  en: ["price error", "pricing error", "price glitch", "pricing glitch", "misprice", "mispriced",
       "price mistake", "pricing mistake", "error fare", "mistake fare"]
  de: ["preisfehler"]
  fr: ["erreur de prix"]
  zh: ["錯價", "出錯價", "標錯價", "價錢錯誤"]
  ja: ["価格ミス", "価格エラー", "価格誤表記", "価格バグ", "価格設定ミス"]

sale_words:
  en: ["sale", "deal", "discount", "% off", "price drop"]
  ja: ["セール", "特価", "割引", "半額", "値下げ", "タイムセール"]

ignore_words:
  en: ["new customers", "first month", "second item", "2nd item"]
  de: ["neukunden", "lotto"]

expired_words: ["expired", "abgelaufen", "expiré", "ausverkauft", "sold out",
                "終了しました", "已完結", "已結束"]

