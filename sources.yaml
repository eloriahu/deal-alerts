  - {name: Mein-Deal, region: eu, kind: feed, language: de,
     url: "https://www.mein-deal.com/feed/"}
  - {name: Travel-Dealz, region: eu, kind: feed, language: en,
     url: "https://travel-dealz.eu/feed/"}
  - {name: HotUKDeals, region: eu, kind: feed, language: en,
     url: "https://www.hotukdeals.com/rss/hot"}
  - {name: mydealz, region: eu, kind: feed, language: de,
     url: "https://www.mydealz.de/rss/hot"}
  - {name: Dealabs, region: eu, kind: feed, language: fr,
     url: "https://www.dealabs.com/rss/hot"}
